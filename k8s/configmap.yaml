apiVersion: v1
kind: ConfigMap
metadata:
  name: node-health-watcher-config
  namespace: monitoring
data:
  CLUSTER_NAME: pi-k3s
  AIRFLOW_BASE_URL: ""
  AIRFLOW_DAG_ID: node_health_alert
  GHA_DISPATCH_URL: https://api.github.com/repos/Jmake-space/homelab-actions/dispatches
  GHA_EVENT_TYPE: k3s-alert
  WATCH_DEBOUNCE_SECONDS: "5"
  DOWN_CONFIRM_SECONDS: "600"
  RECOVERY_CONFIRM_SECONDS: "900"
  NODE_PROBE_ENABLED: "true"
  NODE_PROBE_INTERVAL_SECONDS: "30"
  NODE_PROBE_TIMEOUT_SECONDS: "1"
  HOST_UNREACHABLE_CONFIRM_SECONDS: "300"
  CLUSTER_UNAVAILABLE_CONFIRM_SECONDS: "1800"
  MAX_OBSERVATION_GAP_SECONDS: "60"
  DELIVERY_MAX_ATTEMPTS: "5"
  AIRFLOW_MAX_RETRIES: "5"
  AIRFLOW_TIMEOUT_SECONDS: "10"
  INCIDENT_LOG_PATH: /var/lib/node-health-watcher/watcher/incidents.ndjson
  STATE_PATH: /var/lib/node-health-watcher/watcher/state.json
  LOG_LEVEL: INFO
